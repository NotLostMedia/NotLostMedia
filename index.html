<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Not Lost Media</title>
  <meta name="description" content="Un museo de videos de internet.">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --fondo: #161714;
      --rosa: #e61b7d;
      --rosa-oscuro: #a6155a;
      --blanco: #ffffff;
      --gris: #a8a8a4;

      /* Cinta: alto del patrón y tiempo que tarda en recorrer una repetición */
      --alto-cinta: clamp(56px, 8vw, 170px);
      --vel-cinta: 8s;

      --fuente: "Archivo Narrow", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--fondo);
      color: var(--blanco);
      font-family: var(--fuente);
      line-height: 1.5;
    }

    /* ---------- PORTADA ---------- */
    .portada {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      padding-top: clamp(16px, 4vw, 70px);
    }

    .cinta {
      height: var(--alto-cinta);
      background: url("assets/cinta.png") repeat-x 0 0 / auto 100%;
      animation: mover var(--vel-cinta) linear infinite;
      flex: none;
    }
    /* 809 / 424 = proporción del PNG: se mueve exactamente un ancho de patrón */
    @keyframes mover {
      to { background-position-x: calc(var(--alto-cinta) * -1.908); }
    }

    .centro {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(24px, 4vw, 72px);
      padding: 2rem 1rem 3rem;
      text-align: center;
    }
    .logo {
      width: clamp(220px, 25vw, 560px);
      max-width: 70vw;
      height: auto;
      display: block;
    }
    .bienvenida {
      margin: 0;
      font-size: clamp(18px, 2.1vw, 42px);
      line-height: 1.45;
      max-width: 40ch;
    }
    .bienvenida p { margin: 0 0 1.1em; }
    .bienvenida p:last-child { margin-bottom: 0; }

    .bajar {
      color: var(--rosa);
      text-decoration: none;
      font-size: clamp(18px, 2vw, 32px);
      line-height: 1;
    }
    .bajar:focus-visible { outline: 2px solid var(--rosa); outline-offset: 6px; }

    /* ---------- VIDEOS ---------- */
    .videos {
      max-width: 1200px;
      margin: 0 auto;
      padding: clamp(32px, 6vw, 96px) 1rem 4rem;
    }
    .videos h2 {
      margin: 0 0 1.5rem;
      font-weight: 600;
      font-size: clamp(28px, 4vw, 56px);
      color: var(--rosa);
      line-height: 1;
    }

    .grilla {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.25rem;
    }
    .tarjeta {
      border: 1px solid var(--rosa);
      background: none;
      color: inherit;
      text-align: left;
      padding: 0;
      cursor: pointer;
      font: inherit;
      display: block;
    }
    .tarjeta:hover, .tarjeta:focus-visible { background: var(--rosa-oscuro); }
    .tarjeta:focus-visible { outline: 3px solid var(--blanco); outline-offset: 2px; }
    .miniatura {
      aspect-ratio: 16 / 9;
      background: var(--rosa-oscuro);
      display: block;
      width: 100%;
      object-fit: cover;
    }
    .info { padding: .75rem; }
    .info h3 { margin: 0; font-size: 1.15rem; font-weight: 600; }
    .info p { margin: .25rem 0 0; font-size: .95rem; color: var(--gris); }
    .info p:empty { display: none; }
    .tarjeta:hover .info p, .tarjeta:focus-visible .info p { color: var(--blanco); }

    dialog {
      width: min(900px, 94vw);
      border: 1px solid var(--rosa);
      padding: 0;
      background: var(--fondo);
      color: var(--blanco);
      font-family: var(--fuente);
    }
    dialog::backdrop { background: rgba(0, 0, 0, .85); }
    .reproductor { aspect-ratio: 16 / 9; background: #000; }
    .reproductor video, .reproductor iframe { width: 100%; height: 100%; border: 0; display: block; }
    .dialogo-pie { display: flex; justify-content: space-between; align-items: start; gap: 1rem; padding: .75rem 1rem; }
    .dialogo-pie h2 { margin: 0; font-size: 1.2rem; font-weight: 600; }
    .dialogo-pie p { margin: .25rem 0 0; color: var(--gris); font-size: .95rem; }
    .dialogo-pie p:empty { display: none; }
    .cerrar {
      border: 1px solid var(--rosa);
      background: none;
      color: var(--rosa);
      padding: .35rem .9rem;
      cursor: pointer;
      font: inherit;
    }
    .cerrar:hover, .cerrar:focus-visible { background: var(--rosa); color: var(--fondo); }
    .vacio { color: var(--gris); }

    .musica-btn {
      position: fixed;
      right: clamp(12px, 2vw, 28px);
      bottom: clamp(12px, 2vw, 28px);
      z-index: 10;
      border: 1px solid var(--rosa);
      background: var(--fondo);
      color: var(--rosa);
      font: inherit;
      font-size: 1rem;
      padding: .4rem .9rem;
      cursor: pointer;
    }
    .musica-btn:hover, .musica-btn:focus-visible { background: var(--rosa); color: var(--fondo); }
    .musica-btn[hidden] { display: none; }

    @media (max-width: 700px) {
      .logo { width: 60vw; max-width: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .cinta { animation: none; }
      html { scroll-behavior: auto; }
    }
  </style>
</head>
<body>

  <section class="portada">
    <div class="cinta" role="presentation"></div>

    <div class="centro">
      <img class="logo" src="assets/logo.png" alt="Not Lost Media">

      <div class="bienvenida">
        <p>Bienvenidx<br>
        Este es un museo de videos de internet, porque guardarlos en un pendrive ya no era suficiente.</p>
        <p>Nada, no tiene mucha más función. Enjoy</p>
      </div>

      <a class="bajar" href="#videos" aria-label="Ir a los videos">↓</a>
    </div>
  </section>

  <main class="videos" id="videos">
    <h2>Videos</h2>
    <div class="grilla" id="grilla"></div>
  </main>

  <dialog id="dialogo" aria-labelledby="dialogo-titulo">
    <div class="reproductor" id="reproductor"></div>
    <div class="dialogo-pie">
      <div>
        <h2 id="dialogo-titulo"></h2>
        <p id="dialogo-descripcion"></p>
      </div>
      <button class="cerrar" id="cerrar" type="button">Cerrar</button>
    </div>
  </dialog>

  <audio id="musica" src="audio/musica.mp3" loop preload="none"></audio>
  <button class="musica-btn" id="musica-btn" type="button" aria-pressed="false">♪ música off</button>

  <script>
    /* ------------------------------------------------------------
       LISTA DE VIDEOS
       Para agregar un video, copiá uno de los bloques y cambiá los datos.

       tipo: "youtube"  -> un video de YouTube (solo hace falta el ID)
             "vimeo"    -> un video de Vimeo (ID y, si es no listado, el hash)
             "archivo"  -> un .mp4 que subís al repo (carpeta /videos)

       Ejemplos:
         { tipo: "youtube", titulo: "...", descripcion: "...",
           id: "dQw4w9WgXcQ" }

         { tipo: "vimeo", titulo: "...", descripcion: "...",
           id: "123456789", hash: "a1b2c3d4e5" }

         { tipo: "archivo", titulo: "...", descripcion: "...",
           src: "videos/mi-video.mp4", miniatura: "miniaturas/mi-video.jpg" }

       La miniatura es opcional (en YouTube y Vimeo se busca sola).
    ------------------------------------------------------------ */
    const VIDEOS = [
      {
        tipo: "youtube",
        titulo: "Todos los botones del cerebro",
        descripcion: "",
        id: "4SrfMiIbuhY"
      },
      {
        tipo: "youtube",
        titulo: "Baila pinguino baila",
        descripcion: "",
        id: "4MaVTJyN7ug"
      },
      {
        tipo: "youtube",
        titulo: "Perro oaaa",
        descripcion: "",
        id: "mNfzOqUDumg"
      },
      {
        tipo: "youtube",
        titulo: "Una wacha piola",
        descripcion: "",
        id: "msEEOhEF_Ss"
      },
      {
        tipo: "youtube",
        titulo: "La galletita infinita",
        descripcion: "",
        id: "fkhcYjc_rbw"
      },
      {
        tipo: "youtube",
        titulo: "EU VOU TE PEGAR/DJ HENRIQUE DE FERRAZ",
        descripcion: "",
        id: "vLF7JzUeVOY"
      },
      {
        tipo: "youtube",
        titulo: "Mamá soy drogadicto",
        descripcion: "",
        id: "N598lH_zQSs"
      },
      {
        tipo: "youtube",
        titulo: "Video 8",
        descripcion: "",
        id: "3FPFVquCdgc"
      },
      {
        tipo: "youtube",
        titulo: "Video 9",
        descripcion: "",
        id: "sAit66qi-EI"
      },
      {
        tipo: "youtube",
        titulo: "Video 10",
        descripcion: "",
        id: "p_rcXQc_x5w"
      },
      {
        tipo: "youtube",
        titulo: "Video 11",
        descripcion: "",
        id: "xuCn8ux2gbs"
      },
      {
        tipo: "youtube",
        titulo: "Video 12",
        descripcion: "",
        id: "hK9LamdoEB0"
      },
      {
        tipo: "youtube",
        titulo: "Video 13",
        descripcion: "",
        id: "6ieHdJdAUfQ"
      },
      {
        tipo: "youtube",
        titulo: "Video 14",
        descripcion: "",
        id: "Jh_SrB6wRlY"
      },
      {
        tipo: "youtube",
        titulo: "Video 15",
        descripcion: "",
        id: "UZW4yztj4Is"
      },
      {
        tipo: "youtube",
        titulo: "Video 16",
        descripcion: "",
        id: "53luRvYvv9Q"
      }
    ];

    const grilla = document.getElementById("grilla");
    const dialogo = document.getElementById("dialogo");
    const reproductor = document.getElementById("reproductor");
    const tituloDialogo = document.getElementById("dialogo-titulo");
    const descDialogo = document.getElementById("dialogo-descripcion");

    function miniaturaDe(v) {
      if (v.miniatura) return v.miniatura;
      if (v.tipo === "youtube") return "https://i.ytimg.com/vi/" + v.id + "/hqdefault.jpg";
      return "";
    }

    function urlVimeo(v) {
      return "https://vimeo.com/" + v.id + (v.hash ? "/" + v.hash : "");
    }

    // Busca la miniatura en Vimeo. Si falla, queda el recuadro de color.
    async function cargarMiniaturaVimeo(v, hueco) {
      try {
        const r = await fetch("https://vimeo.com/api/oembed.json?url=" + encodeURIComponent(urlVimeo(v)));
        if (!r.ok) return;
        const datos = await r.json();
        if (!datos.thumbnail_url) return;
        const img = document.createElement("img");
        img.className = "miniatura";
        img.src = datos.thumbnail_url;
        img.alt = "";
        img.loading = "lazy";
        hueco.replaceWith(img);
      } catch (e) { /* sin miniatura */ }
    }

    function crearTarjeta(v) {
      const boton = document.createElement("button");
      boton.type = "button";
      boton.className = "tarjeta";

      const mini = miniaturaDe(v);
      if (mini) {
        const img = document.createElement("img");
        img.className = "miniatura";
        img.src = mini;
        img.alt = "";
        img.loading = "lazy";
        boton.appendChild(img);
      } else {
        const hueco = document.createElement("span");
        hueco.className = "miniatura";
        boton.appendChild(hueco);
        if (v.tipo === "vimeo") cargarMiniaturaVimeo(v, hueco);
      }

      const info = document.createElement("div");
      info.className = "info";
      const h3 = document.createElement("h3");
      h3.textContent = v.titulo;
      const p = document.createElement("p");
      p.textContent = v.descripcion || "";
      info.append(h3, p);
      boton.appendChild(info);

      boton.addEventListener("click", () => abrir(v));
      return boton;
    }

    function abrir(v) {
      pausarMusicaPorVideo();
      reproductor.innerHTML = "";
      if (v.tipo === "vimeo") {
        const iframe = document.createElement("iframe");
        const params = (v.hash ? "h=" + v.hash + "&" : "") + "autoplay=1";
        iframe.src = "https://player.vimeo.com/video/" + v.id + "?" + params;
        iframe.title = v.titulo;
        iframe.allow = "autoplay; fullscreen; picture-in-picture";
        iframe.allowFullscreen = true;
        reproductor.appendChild(iframe);
      } else if (v.tipo === "youtube") {
        const iframe = document.createElement("iframe");
        iframe.src = "https://www.youtube-nocookie.com/embed/" + v.id + "?autoplay=1";
        iframe.title = v.titulo;
        iframe.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
        iframe.allowFullscreen = true;
        reproductor.appendChild(iframe);
      } else {
        const video = document.createElement("video");
        video.src = v.src;
        video.controls = true;
        video.autoplay = true;
        video.playsInline = true;
        reproductor.appendChild(video);
      }
      tituloDialogo.textContent = v.titulo;
      descDialogo.textContent = v.descripcion || "";
      dialogo.showModal();
    }

    function cerrar() {
      dialogo.close();
    }

    dialogo.addEventListener("close", () => { reproductor.innerHTML = ""; reanudarMusica(); });
    document.getElementById("cerrar").addEventListener("click", cerrar);
    dialogo.addEventListener("click", (e) => { if (e.target === dialogo) cerrar(); });

    /* ------------------------------------------------------------
       MÚSICA DE FONDO
       El archivo va en audio/musica.mp3.
       Los navegadores no dejan reproducir sonido solo: arranca con el
       primer clic, toque o tecla del visitante. El botón la apaga y la
       prende, y se acuerda de lo que eligió. Al abrir un video, la
       música se pausa y vuelve cuando se cierra.
    ------------------------------------------------------------ */
    const musica = document.getElementById("musica");
    const botonMusica = document.getElementById("musica-btn");
    const VOLUMEN = 0.4;
    let pausadaPorVideo = false;
    musica.volume = VOLUMEN;

    function leerPreferencia() {
      try { return localStorage.getItem("musica"); } catch (e) { return null; }
    }
    function guardarPreferencia(valor) {
      try { localStorage.setItem("musica", valor); } catch (e) { /* sin guardado */ }
    }
    function pintarBoton() {
      const sonando = !musica.paused;
      botonMusica.textContent = sonando ? "♪ música on" : "♪ música off";
      botonMusica.setAttribute("aria-pressed", String(sonando));
    }
    function reproducir() {
      const intento = musica.play();
      if (intento && intento.catch) intento.catch(() => pintarBoton());
    }

    function primerGesto(e) {
      if (e.target.closest && e.target.closest("#musica-btn")) return; // lo maneja el botón
      quitarEscuchas();
      if (leerPreferencia() === "off") return;
      // Si el primer clic fue para abrir un video, la música espera a que se cierre
      if (dialogo.open) { pausadaPorVideo = true; return; }
      reproducir();
    }
    function quitarEscuchas() {
      ["click", "touchend", "keydown"].forEach((t) => document.removeEventListener(t, primerGesto));
    }
    ["click", "touchend", "keydown"].forEach((t) => document.addEventListener(t, primerGesto));

    botonMusica.addEventListener("click", () => {
      quitarEscuchas();
      if (musica.paused) { guardarPreferencia("on"); reproducir(); }
      else { guardarPreferencia("off"); musica.pause(); }
    });
    musica.addEventListener("play", pintarBoton);
    musica.addEventListener("pause", pintarBoton);
    // Si el archivo no existe o falla, se esconde el botón
    musica.addEventListener("error", () => { botonMusica.hidden = true; });

    function pausarMusicaPorVideo() {
      if (!musica.paused) { musica.pause(); pausadaPorVideo = true; }
    }
    function reanudarMusica() {
      if (pausadaPorVideo) { pausadaPorVideo = false; reproducir(); }
    }
    pintarBoton();

    if (VIDEOS.length === 0) {
      const vacio = document.createElement("p");
      vacio.className = "vacio";
      vacio.textContent = "Todavía no hay videos.";
      grilla.replaceWith(vacio);
    } else {
      VIDEOS.forEach((v) => grilla.appendChild(crearTarjeta(v)));
    }
  </script>
</body>
</html>
